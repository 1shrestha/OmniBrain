# OmniBrain — nginx reverse proxy for omnibrain.in
#
# Routes:
#   https://omnibrain.in/           -> Streamlit frontend (container "frontend":8501)
#   https://omnibrain.in/api/v1/... -> FastAPI backend    (container "backend":8000)
#
# Streamlit needs WebSocket upgrade headers for its live UI updates —
# without the Upgrade/Connection headers below, the app loads but
# every interaction silently fails to update.

server {
    listen 80;
    server_name omnibrain.in www.omnibrain.in;

    # Certbot ACME HTTP-01 challenge — must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else redirects to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name omnibrain.in www.omnibrain.in;

    ssl_certificate     /etc/letsencrypt/live/omnibrain.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omnibrain.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 60M;   # allow PDF uploads up to the backend's 50MB limit + headroom

    # ── Backend API ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Streamlit frontend ───────────────────────────────────────────
    location / {
        proxy_pass http://frontend:8501/;
        proxy_http_version 1.1;

        # Required for Streamlit's WebSocket connection
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;   # keep long-lived WebSocket connections open
    }
}
