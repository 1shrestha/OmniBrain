# Bootstrap config — used ONLY for the first certbot run, before a
# certificate exists. The final HTTPS config (omnibrain.conf) references
# cert files that don't exist yet on a brand-new server, so nginx would
# refuse to start with it. init-letsencrypt.sh swaps this out automatically
# once the certificate has been issued — you shouldn't need to touch this.

server {
    listen 80;
    server_name omnibrain.in www.omnibrain.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "OmniBrain is being set up — check back shortly.";
        add_header Content-Type text/plain;
    }
}
